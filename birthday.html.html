*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{

left:0;

align-items:center;

}

opacity:0;

}

#startBtn{

padding:20px 50px;

font-size:28px;

border:none;

border-radius:60px;

background:#ff2b2b;

color:white;

box-shadow:0 0 35px rgba(255,0,0,.7);

transition:.35s;

}

#startBtn:hover{

transform:scale(1.08);

}

/* ===== Message ===== */

#message{

position:absolute;

left:6%;

top:10%;

width:35%;

color:white;

z-index:5;

opacity:0;

}

#title{

font-size:52px;

font-weight:700;

margin-bottom:18px;

}

#line{

width:170px;

height:2px;

background:white;

margin-bottom:25px;

opacity:.7;

}

#text{

font-size:26px;

line-height:1.8;

white-space:pre-line;

}

.cursor{

display:inline-block;

width:2px;

height:28px;

background:white;

animation:blink .8s infinite;

}

@keyframes blink{

50%{
opacity:0;
}

}

@media(max-width:900px){

#message{

width:48%;
left:20px;
top:40px;

}

#title{

font-size:34px;

}

#text{

peace,

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const text=document.getElementById("text");

function resize(){

canvas.width=innerWidth;
canvas.height=innerHeight;

}

resize();

window.onresize=resize;

// =========================
// Draw Tree Trunk
// =========================

function drawTree(){

    const x=canvas.width*0.73;
    const y=canvas.height*0.52;

    ctx.save();

    ctx.strokeStyle="#ff5555";
    ctx.shadowColor="#ff4444";
    ctx.shadowBlur=25;
    ctx.lineWidth=12;

    ctx.beginPath();

    ctx.moveTo(x,canvas.height);

    ctx.bezierCurveTo(
        x-10,
        canvas.height*.80,
        x-15,
        canvas.height*.65,
        x,
        y
    );

    ctx.stroke();

    ctx.lineWidth=7;

    // Left Branch
    ctx.beginPath();

    ctx.moveTo(x,y);

    ctx.quadraticCurveTo(
        x-70,
        y-80,
        x-170,
        y-150
    );

    ctx.stroke();

    // Right Branch
    ctx.beginPath();

    ctx.moveTo(x,y);

    ctx.quadraticCurveTo(
        x+70,
        y-80,
        x+170,
        y-150
    );

    ctx.stroke();

    ctx.restore();

}

// =========================
// Background Glow
// =========================

function drawGlow(){

    const g=ctx.createRadialGradient(

        canvas.width*0.73,
        canvas.height*0.33,
        10,

        canvas.width*0.73,
        canvas.height*0.33,
        260

    );

    g.addColorStop(0,"rgba(255,70,70,.45)");
    g.addColorStop(.5,"rgba(255,40,40,.18)");
    g.addColorStop(1,"rgba(255,0,0,0)");

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.arc(
        canvas.width*0.73,
        canvas.height*0.33,
        260,
        0,
        Math.PI*2
    );

    ctx.fill();

}

// =========================
// Animation
// =========================

}
